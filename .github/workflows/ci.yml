name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  jvm-android:
    # Keep the SDK/toolchain stable when ubuntu-latest moves to a new release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Android SDK
        shell: bash
        run: |
          # GitHub's Ubuntu image provides the SDK and accepted licenses.
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Unit tests, lint and debug APK
        run: ./gradlew :core:jvmTest :composeApp:testDebugUnitTest :composeApp:lintDebug :composeApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: check-reports
          path: |
            core/build/reports/tests/
            composeApp/build/reports/tests/
            composeApp/build/reports/lint-results-debug.html

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Kotlin 2.1.21 supports this SDK; do not silently follow the runner default.
      DEVELOPER_DIR: /Applications/Xcode_16.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-xcode16.3-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Verify Apple toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Build iOS simulator app
        run: bash .github/scripts/ios-checks.sh build
      - name: Boot iOS test simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "--json"]))
          # Prefer an installed iOS 18 runtime for the Xcode 16 toolchain.
          runtimes = [r for r in data["runtimes"] if r.get("isAvailable") and r["name"].startswith("iOS 18.")]
          if not runtimes:
              raise SystemExit("No available iOS 18 simulator runtime on the runner")
          runtime = min(runtimes, key=lambda r: tuple(map(int, r["version"].split("."))))
          device = subprocess.check_output(["xcrun", "simctl", "create", "PocketBucket CI",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16", runtime["identifier"]], text=True).strip()
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"IOS_SIMULATOR_ID={device}\n")
          print(f"Created {device} using {runtime['name']}")
          subprocess.run(["xcrun", "simctl", "boot", device], check=True)
          subprocess.run(["xcrun", "simctl", "bootstatus", device, "-b"], check=True)
          PY
      - name: Shared native tests
        run: bash .github/scripts/ios-checks.sh test
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-check-reports
          path: |
            build/ci/
            core/build/reports/tests/iosSimulatorArm64Test/
            composeApp/build/reports/tests/iosSimulatorArm64Test/
            core/build/test-results/iosSimulatorArm64Test/
            composeApp/build/test-results/iosSimulatorArm64Test/
      - name: Remove CI simulator
        if: always() && env.IOS_SIMULATOR_ID != ''
        run: |
          xcrun simctl shutdown "$IOS_SIMULATOR_ID" || true
          xcrun simctl delete "$IOS_SIMULATOR_ID"
