name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  jvm-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Unit tests, lint and debug APK
        run: ./gradlew :core:jvmTest :composeApp:testDebugUnitTest :composeApp:lintDebug :composeApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-reports
          path: |
            core/build/reports/tests/
            composeApp/build/reports/tests/
            composeApp/build/reports/lint-results-debug.html
